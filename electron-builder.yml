appId: nz.aplusfinance.operator
productName: A Plus Operator
directories:
  output: release
files:
  - src/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: false
publish: null
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: APlusOperator-Setup-${version}.${ext}
